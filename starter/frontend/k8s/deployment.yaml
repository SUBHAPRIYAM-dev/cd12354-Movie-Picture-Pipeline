apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 565881508065.dkr.ecr.ap-south-1.amazonaws.com/movie-app:frontend-latest
          ports:
            - containerPort: 3000

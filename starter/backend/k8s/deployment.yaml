apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 565881508065.dkr.ecr.ap-south-1.amazonaws.com/movie-app:latest
          ports:
            - containerPort: 5000
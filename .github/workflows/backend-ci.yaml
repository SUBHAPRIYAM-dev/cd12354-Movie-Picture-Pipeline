name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'starter/backend/**'
      - '.github/workflows/backend-ci.yaml'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.10'
  BACKEND_DIRECTORY: starter/backend

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-

      - name: Install dependencies from Pipfile.lock
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: |
          pip install --upgrade pip
          pip install pipfile-requirements
          pipfile-requirements Pipfile.lock > requirements.txt
          pip install -r requirements.txt black flake8

      - name: Run lint
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: flake8 .

  test:
    name: Backend Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('starter/backend/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-

      - name: Install dependencies from Pipfile.lock
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: |
          pip install --upgrade pip
          pip install pipfile-requirements
          pipfile-requirements Pipfile.lock > requirements.txt
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: pytest -v

  build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ${{ env.BACKEND_DIRECTORY }}
        run: docker build --tag mp-backend:latest .
